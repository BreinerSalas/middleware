services:
  # Solo para dev local con Mongo propio; si MONGODB_URI en .env apunta a otra
  # instancia (staging/prod), este servicio queda sin uso — app no depende de él.
  mongo:
    image: mongo:7
    container_name: smartflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smartflow-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3007}
    # host: el Mongo local de esta máquina escucha solo en 127.0.0.1, así que
    # el contenedor necesita la red del host para llegar a "localhost:27017"
    # tal cual está en .env (bridge/host.docker.internal no alcanza loopback-only).
    network_mode: host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3007/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
